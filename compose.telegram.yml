name: opengym-telegram

services:
  api:
    image: opengym-telegram-api:local
    build:
      context: ./api
      target: default
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      RP_ID: ${APP_HOST:-localhost}
      ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      RP_NAME: Жимолость
      TRUST_PROXY: 1
      INVITE_ONLY: ${INVITE_ONLY:-1}
      ALLOW_GUEST: ${ALLOW_GUEST:-0}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}
      FIRST_USER_ADMIN: ${FIRST_USER_ADMIN:-0}
      COACH_DISABLED: 1
      # Personal media sync needs additional owner-bound transport checks before enabling.
      MEDIA_UPLOADS: 0
      # Profiles come only from Telegram's signed launch data: no passkey, password or pairing routes.
      TELEGRAM_ONLY: 1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # An omitted value stays unset so public Telegram sign-up can be enabled deliberately.
      TELEGRAM_ALLOWED_IDS:
    volumes:
      - ./data:/data

  web:
    image: opengym-telegram-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        APP_BUILD: telegram-20261022-zhimolost
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      NGINX_PORT: 80
      BACKEND: api
      PORT: 3000
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m

  bot:
    profiles: [telegram]
    build:
      context: ./integration
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      TELEGRAM_ALLOWED_IDS:

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    depends_on:
      - web
    command: ["tunnel", "run", "--token-file", "/run/secrets/cloudflare-tunnel-token"]
    volumes:
      - ./.secrets/cloudflare-tunnel-token:/run/secrets/cloudflare-tunnel-token:ro

  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./integration/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
